name: Update Kaufman daily data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-daily-data.yml"
      - "scripts/update_daily_data.py"
      - "scripts/update_platform_data.mjs"
      - "scripts/update_public_market_api.mjs"
      - "scripts/update_regulation_data.mjs"
      - "scripts/validate_static_data.mjs"
      - "server/**"

permissions:
  contents: write

concurrency:
  group: kaufman-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Update official regulation sources
        run: node scripts/update_regulation_data.mjs
      - name: Update daily editorial signals
        run: python scripts/update_daily_data.py
      - name: Update platform intelligence
        run: node scripts/update_platform_data.mjs
      - name: Build public market fallbacks
        run: node scripts/update_public_market_api.mjs
      - name: Validate generated data contracts
        run: node scripts/validate_static_data.mjs
      - name: Commit changed snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git switch --force-create "daily-publish-${GITHUB_RUN_ID}-${attempt}" origin/main
              node scripts/update_regulation_data.mjs
              python scripts/update_daily_data.py
              node scripts/update_platform_data.mjs
              node scripts/update_public_market_api.mjs
              node scripts/validate_static_data.mjs
            fi
            if git diff --quiet -- assets/daily-data.js assets/regulation-data.js assets/platform-data.js api/market; then
              exit 0
            fi
            git add assets/daily-data.js assets/regulation-data.js assets/platform-data.js api/market
            git commit -m "data: update daily public sources"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
