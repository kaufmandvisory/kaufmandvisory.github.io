name: Update Kaufman bank intelligence

on:
  schedule:
    - cron: "43 5 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-bank-intelligence.yml"
      - "scripts/update_bank_intelligence.mjs"
      - "scripts/validate_bank_intelligence.mjs"

permissions:
  contents: write

concurrency:
  group: kaufman-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Refresh ranking and official bank sources
        run: node scripts/update_bank_intelligence.mjs
      - name: Validate the complete weekly snapshot
        run: node scripts/validate_bank_intelligence.mjs
      - name: Publish changed snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git switch --force-create "bank-publish-${GITHUB_RUN_ID}-${attempt}" origin/main
              node scripts/update_bank_intelligence.mjs
              node scripts/validate_bank_intelligence.mjs
            fi
            if git diff --quiet -- assets/bank-intelligence.js; then
              exit 0
            fi
            git add assets/bank-intelligence.js
            git commit -m "data: update weekly bank intelligence"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
