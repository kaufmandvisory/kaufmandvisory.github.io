name: Update Kaufman reference prices

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-market-prices.yml"
      - "scripts/update_market_price_snapshot.mjs"
      - "scripts/validate_automated_market_snapshot.mjs"
      - ".netlify-functions/market-snapshot.mjs"

permissions:
  contents: write

concurrency:
  group: kaufman-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Calculate server-side reference prices
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node scripts/update_market_price_snapshot.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 20
          done
      - name: Validate freshness and price contract
        run: node scripts/validate_automated_market_snapshot.mjs
      - name: Publish changed snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git switch --force-create "price-publish-${GITHUB_RUN_ID}-${attempt}" origin/main
              node scripts/update_market_price_snapshot.mjs
              node scripts/validate_automated_market_snapshot.mjs
            fi
            if git diff --quiet -- api/market/snapshot api/market/gas; then
              exit 0
            fi
            git add api/market/snapshot api/market/gas
            git commit -m "data: update automatic reference prices"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
