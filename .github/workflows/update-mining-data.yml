name: Update Kaufman mining data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-mining-data.yml"
      - "scripts/update_mining_data.py"
      - "scripts/update_daily_data.py"
      - "scripts/validate_static_data.mjs"

permissions:
  contents: write

concurrency:
  group: kaufman-mining-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Refresh mining network and economics
        run: python scripts/update_mining_data.py
      - name: Validate generated data contracts
        run: node scripts/validate_static_data.mjs
      - name: Commit changed mining snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git switch --force-create "mining-publish-${GITHUB_RUN_ID}-${attempt}" origin/main
              python scripts/update_mining_data.py
              node scripts/validate_static_data.mjs
            fi
            if git diff --quiet -- assets/daily-data.js; then
              exit 0
            fi
            git add assets/daily-data.js
            git commit -m "data: update automatic mining snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
