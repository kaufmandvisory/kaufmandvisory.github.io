name: Update Kaufman mining data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-mining-data.yml"
      - "scripts/update_mining_data.py"
      - "scripts/update_daily_data.py"
      - "scripts/validate_static_data.mjs"

permissions:
  contents: write

concurrency:
  group: kaufman-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Refresh mining network and economics
        run: python scripts/update_mining_data.py
      - name: Validate generated data contracts
        run: node scripts/validate_static_data.mjs
      - name: Commit changed mining snapshot
        shell: bash
        run: |
          if git diff --quiet -- assets/daily-data.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/daily-data.js
          git commit -m "data: update automatic mining snapshot"
          git push
