[build]
  publish = "."

[functions]
  directory = ".netlify-functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/api/market/snapshot"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/market/context"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/market/gas"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
