[build]
  publish = "."

[functions]
  directory = ".netlify-functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/market/stream"
  to = "/.netlify/functions/market-stream"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/snapshot"
  to = "/.netlify/functions/market-snapshot"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/context"
  to = "/.netlify/functions/market-context"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/gas"
  to = "/.netlify/functions/ethereum-gas"
  status = 200
  force = true

[[headers]]
  for = "/api/market/stream"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache, no-store, no-transform"
    X-Accel-Buffering = "no"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/market/snapshot"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/market/context"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/market/gas"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
