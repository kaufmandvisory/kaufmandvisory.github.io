[build]
  publish = "."

[functions]
  directory = ".netlify-functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31556952; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self' mailto:; script-src 'self' https://www.googletagmanager.com https://gc.zgo.at; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://l2beat.com https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self' data:; media-src 'self'; connect-src 'self' https://leafy-pudding-3f3427.netlify.app https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://kaufman.goatcounter.com; upgrade-insecure-requests"

[[redirects]]
  from = "/api/market/stream"
  to = "/.netlify/functions/market-stream"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/snapshot"
  to = "/.netlify/functions/market-snapshot"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/context"
  to = "/.netlify/functions/market-context"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/gas"
  to = "/.netlify/functions/ethereum-gas"
  status = 200
  force = true

[[headers]]
  for = "/api/market/stream"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache, no-store, no-transform"
    X-Accel-Buffering = "no"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/market/snapshot"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/market/context"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/market/gas"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
